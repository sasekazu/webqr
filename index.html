<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR Code Generator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap">
  <style>
    body, textarea, button { font-family: "Poppins", "Hiragino Sans", "Meiryo", sans-serif; }
  </style>
</head>
<body>
  <h1>QR Code Generator</h1>
  <textarea id="input" rows="4" cols="50" placeholder="Enter text or a URL" autofocus></textarea>
  <div id="actions" hidden>
    <button id="copy">Copy to clipboard</button>
    <button id="download">Download PNG</button>
    <span id="msg"></span>
  </div>
  <div id="qr"><canvas id="canvas" hidden></canvas></div>
  <p id="error" hidden>Text is too long to fit in a QR code</p>

<script>
  const input = document.getElementById("input");
  const canvas = document.getElementById("canvas");
  const actions = document.getElementById("actions");
  const error = document.getElementById("error");
  const msg = document.getElementById("msg");
  const CELL = 6;          // on-screen size of one module in pixels
  const QUIET = 4;         // white border width in modules (QR spec recommends 4)
  const EXPORT_SIZE = 1024; // approximate image size in pixels for copy/download
  let current = null;      // the QR code currently shown
  // Encode as UTF-8 so Japanese and other non-ASCII text works correctly
  qrcode.stringToBytes = qrcode.stringToBytesFuncs["UTF-8"];

  function show(state) {
    canvas.hidden = actions.hidden = state !== "qr";
    error.hidden = state !== "error";
    msg.textContent = "";
  }

  function draw(target, qr, cell) {
    const count = qr.getModuleCount();
    const margin = QUIET * cell;
    const size = count * cell + margin * 2;
    target.width = target.height = size;
    const ctx = target.getContext("2d");
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, size, size);
    ctx.fillStyle = "#000";
    for (let r = 0; r < count; r++) {
      for (let c = 0; c < count; c++) {
        if (qr.isDark(r, c)) ctx.fillRect(margin + c * cell, margin + r * cell, cell, cell);
      }
    }
  }

  // Render a high-resolution copy; whole-pixel modules keep the edges sharp
  function exportCanvas() {
    const cell = Math.ceil(EXPORT_SIZE / (current.getModuleCount() + QUIET * 2));
    const big = document.createElement("canvas");
    draw(big, current, cell);
    return big;
  }

  input.addEventListener("input", () => {
    const text = input.value;
    if (!text) return show("none");
    try {
      const qr = qrcode(0, "M"); // 0 = pick the size automatically based on text length
      qr.addData(text, "Byte");
      qr.make();
      current = qr;
      draw(canvas, qr, CELL);
      show("qr");
    } catch (e) {
      show("error");
    }
  });

  document.getElementById("copy").addEventListener("click", async () => {
    try {
      const big = exportCanvas();
      const blob = new Promise((resolve) => big.toBlob(resolve, "image/png"));
      await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
      msg.textContent = "Copied!";
    } catch (e) {
      msg.textContent = "Copy failed. Try Download instead.";
    }
  });

  document.getElementById("download").addEventListener("click", () => {
    const a = document.createElement("a");
    a.href = exportCanvas().toDataURL("image/png");
    a.download = "qrcode.png";
    a.click();
    msg.textContent = "";
  });
</script>
</body>
</html>
